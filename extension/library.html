<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>pikko.</title><link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="assets/icon-16.png">
  <link rel="stylesheet" href="library.css">
  <script type="module" src="library.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="library.html" aria-label="pikko. 首页"><span class="brand-symbol" aria-hidden="true"></span><span>pikko.</span></a>
    <div class="workspace"><span>我的资料库</span><span class="workspace-label">个人空间</span></div>
    <div class="nav-label">快捷访问</div>
    <nav id="main-nav" aria-label="素材视图">
      <button class="nav-item active" data-view="all"><span class="nav-icon">▦</span><span>全部资料</span><span id="all-count" class="nav-count">0</span></button>
      <button class="nav-item" data-view="starred"><span class="nav-icon">☆</span><span>已评分</span><span id="starred-count" class="nav-count">0</span></button>
      <button class="nav-item" data-view="recent"><span class="nav-icon">◷</span><span>最近收藏</span></button>
    </nav>
    <div class="nav-label folder-label"><span>文件夹</span><button id="add-root-folder" class="icon-button" title="新建文件夹" aria-label="新建顶层文件夹">＋</button></div>
    <nav id="folder-tree" class="folder-tree" aria-label="文件夹"></nav>
    <div class="sidebar-bottom"><button id="export" class="quiet-button">↗ 导出素材索引</button><button id="clear-library" class="quiet-button danger-text">清空素材记录</button></div>
  </aside>

  <main class="main">
    <header class="topbar"><div class="breadcrumb"><button id="breadcrumb-home" type="button">资料库</button><span id="breadcrumb-name">全部资料</span></div><div class="topbar-right"><button id="directory-toggle" class="text-button" aria-expanded="false" aria-controls="directory-panel">原文件连接</button><span class="local-badge"><i></i> 本地资料库</span></div></header>
    <nav id="folder-spines" class="folder-spines" aria-label="侧叠文件夹"></nav>
    <section class="content">
      <div class="page-heading"><div><h1 id="view-title">全部资料</h1><p id="view-description" hidden></p></div><div class="heading-actions"><button id="new-folder" class="button button-white">＋ 新建文件夹</button><button id="refresh" class="button button-white" title="刷新素材库">↻ 刷新</button><button id="import-button" class="button button-primary">＋ 导入原文件</button><input id="import-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp,image/avif,video/mp4,video/webm,video/quicktime,video/x-m4v" multiple hidden></div></div>
      <section id="directory-panel" class="directory-panel" hidden aria-label="本地原文件连接"><div class="directory-icon">▱</div><div class="directory-copy"><strong id="directory-title">连接原文件</strong><p id="directory-description">选择 下载 / AdVault 文件夹。</p></div><div class="directory-actions"><button id="directory-authorize" class="button button-white" hidden>重新授权</button><button id="directory-choose" class="button button-white">关联文件夹</button><button id="directory-forget" class="icon-button" title="断开目录关联，不删除任何文件" aria-label="断开目录关联" hidden>×</button></div></section>
      <div id="load-error" class="error-panel" role="alert" hidden></div>
      <nav id="folder-shelf" class="folder-shelf" aria-label="子文件夹"></nav>
      <div class="filter-bar"><label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索名称、标签、备注…" aria-label="搜索素材"><kbd>/</kbd></label><select id="type-filter" aria-label="筛选素材类型"><option value="all">全部类型</option><option value="image">图片</option><option value="video">视频</option></select><select id="platform-filter" aria-label="筛选来源平台"><option value="all">全部平台</option><option value="Meta">Meta</option><option value="Google">Google</option><option value="其他">其他</option></select><select id="rating-filter" aria-label="筛选星级"><option value="0">全部星级</option><option value="1">1 星及以上</option><option value="2">2 星及以上</option><option value="3">3 星及以上</option><option value="4">4 星及以上</option><option value="5">5 星精选</option></select><button id="reset-filters" class="icon-button" title="重置筛选" aria-label="重置筛选">↺</button></div>
      <details id="period-panel" class="period-panel"><summary id="period-current">时间：全部时间 · 文件夹月份</summary><div class="period-bar" aria-label="时间范围">
        <span class="period-caption">时间范围</span><select id="period-source" aria-label="时间依据"><option value="folder">文件夹月份</option><option value="collected">收藏月份</option></select>
        <select id="period-year" aria-label="选择年份"><option value="all">全部年份</option></select>
        <label>从 <select id="period-start" aria-label="起始月份"></select></label><span class="range-line">—</span><label>至 <select id="period-end" aria-label="结束月份"></select></label>
        <button id="period-all" class="text-button">全部时间</button><span id="period-summary" role="status"></span>
      </div>
      </details>
      <div class="results-toolbar"><div class="result-summary"><strong id="result-count">0</strong><span>份资料</span><label id="descendants-label" class="checkbox-label" hidden><input id="include-descendants" type="checkbox" checked>包含子文件夹</label></div><div class="results-actions"><button id="export-research" class="text-button" title="导出当前筛选结果中的 BigSpy 数据" hidden>导出数据 CSV</button><details id="folder-actions" class="folder-actions" hidden><summary aria-label="文件夹操作" title="文件夹操作">···</summary><div><button id="folder-materialize" class="text-button" hidden>在本地建立文件夹</button><button id="folder-rename" class="text-button" hidden>重命名</button><button id="folder-delete" class="text-button danger-text" hidden>删除文件夹</button></div></details><select id="sort" class="sort-select" aria-label="排列顺序"><option value="rating">星级从高到低</option><option value="running">投放天数从多到少</option><option value="newest">最新收藏</option><option value="oldest">最早收藏</option><option value="title">名称 A–Z</option></select><div class="view-toggle" role="group" aria-label="显示方式"><button id="grid-view" data-layout="grid" class="active" aria-pressed="true">▦ 大图</button><button id="compact-view" data-layout="compact" aria-pressed="false">▦ 小图</button><button id="list-view" data-layout="list" aria-pressed="false">☰ 列表</button><button id="overview-view" data-layout="overview" aria-pressed="false">▤ 月份总览</button></div></div></div>

      <section id="month-overview" class="month-overview" aria-label="月份总览" hidden></section>
      <div id="list-heading" class="list-heading" hidden><span>名称</span><span>星级</span><span>存放文件夹</span><span>收藏日期</span></div>
      <div id="asset-grid" class="asset-grid" aria-label="素材列表"></div>
      <div id="empty-state" class="empty-state" hidden><div class="empty-art" aria-hidden="true"><span>▧</span><span>▷</span><i>✦</i></div><h2 id="empty-title">暂无资料</h2><p id="empty-description">点击图片或视频上的 pikko. 按钮，选择文件夹即可收藏。<br>也可以导入你已有的原文件，建立本地素材库。</p><button id="empty-import" class="button button-primary">＋ 导入第一份素材</button></div>
    </section>
  </main>

  <dialog id="asset-dialog" class="asset-dialog"><div class="detail-shell"><section class="detail-preview"><button id="detail-close" class="preview-close" aria-label="关闭素材详情">×</button><div id="detail-media" class="detail-media" tabindex="0" role="region" aria-label="素材预览，滚轮缩放，放大后拖动"></div><div id="detail-viewer-toolbar" class="viewer-toolbar" role="toolbar" aria-label="预览工具" hidden><button type="button" data-viewer="out" aria-label="缩小" title="缩小">−</button><output aria-label="缩放比例">100%</output><button type="button" data-viewer="in" aria-label="放大" title="放大">+</button><button type="button" data-viewer="reset" title="恢复完整画面">复位</button><button type="button" data-viewer="expand" aria-expanded="false">放大查看</button></div><div id="detail-media-message" class="detail-media-message" role="status"></div></section><form id="detail-form" class="detail-form"><div class="detail-heading"><span>素材详情</span><span id="detail-status" class="status-badge"></span></div><section class="source-info"><label class="field-label" for="detail-source-url">采集页面链接</label><textarea id="detail-source-url" rows="2" readonly aria-describedby="detail-source-help"></textarea><p id="detail-source-help" class="field-help"></p><div class="detail-links"><a id="detail-source" class="text-button" target="_blank" rel="noopener noreferrer" hidden>↗ 查看来源页面</a><button id="detail-copy-source" type="button" class="text-button" hidden>复制来源链接</button><button id="detail-source-note" type="button" class="text-button" hidden>保存来源说明到原文件旁</button></div><p id="detail-source-note-status" class="field-help" role="status"></p></section><details id="detail-research" class="research-info" hidden><summary id="detail-research-summary">BigSpy</summary><div class="detail-links"><button id="detail-copy-research" type="button" class="text-button">复制广告数据</button><button id="detail-export-research" type="button" class="text-button">导出 CSV</button></div><textarea id="detail-research-text" rows="8" readonly aria-label="BigSpy 广告数据"></textarea></details><label class="field-label" for="detail-title">素材名称</label><input id="detail-title" class="title-input" required maxlength="250"><div class="detail-rating-row"><span class="field-label">星级</span><div id="detail-rating" class="rating detail-rating" aria-label="素材评分"></div></div><label class="field-label" for="detail-folder">存放文件夹</label><select id="detail-folder"></select><p class="field-help">移动到其他文件夹不会改变硬盘原文件。</p><label class="field-label" for="detail-tags">标签</label><input id="detail-tags" placeholder="标签，用逗号分隔" maxlength="2000"><label class="field-label" for="detail-notes">备注</label><textarea id="detail-notes" rows="4" placeholder="备注" maxlength="4000"></textarea><div class="detail-facts"><div><span>来源</span><strong id="detail-platform"></strong></div><div><span>收藏于</span><strong id="detail-date"></strong></div><div><span>文件</span><strong id="detail-filename"></strong></div></div><p id="detail-error" class="inline-error" role="alert" hidden></p><div class="detail-links"><button id="detail-reveal" type="button" class="text-button" hidden>▱ 在文件夹中显示</button><button id="detail-save-file" type="button" class="text-button" hidden>↓ 导出原文件副本</button></div><div class="detail-save-row"><button id="detail-delete" type="button" class="button button-danger">删除记录</button><button id="detail-submit" type="submit" class="button button-primary">保存修改</button></div><p class="field-help delete-help">删除记录不会删除硬盘原文件或已导入的本地副本。</p></form></div></dialog>

  <dialog id="folder-dialog" class="small-dialog"><form id="folder-form"><div class="small-dialog-header"><h2 id="folder-dialog-title">新建文件夹</h2><button type="button" id="folder-dialog-close" class="icon-button" aria-label="关闭">×</button></div><label class="field-label" for="folder-name">文件夹名称</label><input id="folder-name" required maxlength="100" autocomplete="off" placeholder="文件夹名称"><p id="folder-parent-label" class="field-help"></p><p id="folder-error" class="inline-error" role="alert" hidden></p><div class="dialog-actions"><button type="button" id="folder-cancel" class="button button-white">取消</button><button type="submit" id="folder-submit" class="button button-primary">创建文件夹</button></div></form></dialog>
  <dialog id="import-dialog" class="small-dialog"><form id="import-form"><div class="small-dialog-header"><h2>选择存放文件夹</h2><button type="button" id="import-close" class="icon-button" aria-label="关闭导入窗口">×</button></div><label class="field-label" for="import-folder">存放文件夹</label><select id="import-folder" required></select><div class="dialog-actions"><button type="button" id="import-cancel" class="button button-white">取消</button><button type="submit" class="button button-primary">选择文件</button></div></form></dialog>
  <dialog id="confirm-dialog" class="small-dialog"><form method="dialog"><div class="small-dialog-header"><h2 id="confirm-title"></h2></div><p id="confirm-description" class="confirm-description"></p><div class="dialog-actions"><button value="cancel" class="button button-white" autofocus>取消</button><button value="confirm" class="button button-danger">确认删除</button></div></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
